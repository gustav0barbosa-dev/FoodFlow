name: Compose validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker-compose*.yml"
      - "backend/**"
      - "scripts/validate_compose.sh"
      - ".github/workflows/compose-validation.yml"
  pull_request:
    paths:
      - "docker-compose*.yml"
      - "backend/**"
      - "scripts/validate_compose.sh"
      - ".github/workflows/compose-validation.yml"

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate Compose end-to-end
        run: bash scripts/validate_compose.sh

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps || true
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color || true
