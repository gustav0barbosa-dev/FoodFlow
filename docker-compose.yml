version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: foodflow
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: foodflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodflow -d foodflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Serviço pontual: aplica migrações e seed antes da API subir.
  # Mantém a inicialização do banco fora do processo do servidor.
  migrate:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://foodflow:foodflow@postgres:5432/foodflow
    volumes:
      - ./backend:/app
    command: ["python", "scripts/init_db.py"]
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://foodflow:foodflow@postgres:5432/foodflow
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ENABLE_LORA_RERANKER: ${ENABLE_LORA_RERANKER:-false}
      OVERPASS_API_URL: ${OVERPASS_API_URL:-https://overpass-api.de/api/interpreter}
      OVERPASS_CACHE_TTL_SECONDS: ${OVERPASS_CACHE_TTL_SECONDS:-300}
      OVERPASS_TIMEOUT_SECONDS: ${OVERPASS_TIMEOUT_SECONDS:-25}
      OVERPASS_USER_AGENT: ${OVERPASS_USER_AGENT:-FoodFlow/0.2}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Job pontual: `docker compose --profile batch run --rm batch-scorer`
  # Agende no host (cron/Task Scheduler) ou no orquestrador de produção.
  batch-scorer:
    build: ./backend
    profiles: ["batch"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://foodflow:foodflow@postgres:5432/foodflow
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: ["python", "scripts/batch_score.py"]

volumes:
  postgres_data:
